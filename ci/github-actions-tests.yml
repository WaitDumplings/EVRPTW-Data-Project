name: Component tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest
      - run: python -m build
